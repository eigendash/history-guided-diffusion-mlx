[project]
name = "hgd-mlx"
version = "0.1.0"
description = "Per-frame noise levels and history guidance for video diffusion on a toy domain, in MLX"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
